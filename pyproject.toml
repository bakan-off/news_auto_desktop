[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = [
    "E501",   # длинные строки допустимы в UI-коде
    "E701",   # однострочные if/else — существующий стиль проекта
    "E702",   # несколько операторов через «;» — существующий стиль проекта
    "RUF001", # кириллица в строках — это текст приложения, а не опечатки
    "RUF002", # кириллица в докстрингах — документация на русском
    "RUF003", # кириллица в комментариях — комментарии на русском
]

[tool.ruff.lint.isort]
known-first-party = ["core", "main", "theme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
